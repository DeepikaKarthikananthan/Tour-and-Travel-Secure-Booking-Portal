{% extends "base.html" %}
{% block title %}My Profile — Wayfarer & Co.{% endblock %}

{% block content %}
<div class="wf-page-header">
    <div class="container">
        <div class="wf-eyebrow">My Account</div>
        <h1>My Profile</h1>
    </div>
</div>

<div class="container py-5">
    <div class="row g-4">
        <div class="col-lg-3">
            {% include "_account_sidebar.html" with context %}
        </div>
        <div class="col-lg-9">
            <div class="wf-panel p-4 mb-4">
                <h5 class="mb-4">Profile Information</h5>
                <form method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-semibold">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" value="{{ user.email }}" disabled>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
                    </div>
                    <button type="submit" class="btn wf-btn-primary">Save Changes</button>
                </form>
            </div>

            <div class="wf-panel p-4">
                <h5 class="mb-4">Change Password</h5>
                <form method="post" action="{{ url_for('profile.change_password') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Current Password</label>
                        <input type="password" name="current_password" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-semibold">New Password</label>
                            <input type="password" name="new_password" class="form-control" required minlength="6">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-semibold">Confirm New Password</label>
                            <input type="password" name="confirm_password" class="form-control" required minlength="6">
                        </div>
                    </div>
                    <button type="submit" class="btn wf-btn-outline">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
