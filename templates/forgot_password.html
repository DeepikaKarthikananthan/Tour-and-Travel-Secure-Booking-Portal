{% extends "base.html" %}
{% block title %}Forgot Password — Wayfarer & Co.{% endblock %}

{% block content %}
<div class="wf-auth-wrap">
    <div class="container">
        <div class="wf-auth-card">
            <div class="text-center mb-4">
                <div class="wf-eyebrow">Account Recovery</div>
                <h2 class="mt-1">Reset your password</h2>
                <p class="text-muted small mt-2">Enter your email and we'll send you instructions to reset your password.</p>
            </div>
            <form method="post">
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" required autofocus>
                </div>
                <button type="submit" class="btn wf-btn-primary w-100">Send Reset Instructions</button>
            </form>
            <p class="text-center small text-muted mt-4 mb-0">
                <a href="{{ url_for('auth.login') }}"><i class="fa-solid fa-arrow-left me-1"></i>Back to log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
